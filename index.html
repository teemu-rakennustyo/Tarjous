<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#15110B"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Tarjous — Kaivola & Ravattinen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bitumi:#15110B;      /* sivun pohja */
  --multa:#2B2417;       /* logon ruskea, pinnat */
  --multa2:#3A3122;      /* nostetut pinnat, reunat */
  --multa3:#4A3F2D;
  --kulta:#C9A560;       /* aksentti, mittanauha */
  --kulta2:#E2C584;
  --kalkki:#EFE9DD;      /* teksti */
  --savi:#A39784;        /* toissijainen teksti */
  --ok:#93B872;
  --vaara:#E37B55;
  --r-s:6px;--r-m:12px;--r-l:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bitumi)}
body{font-family:"Archivo",system-ui,sans-serif;font-stretch:100%;background:var(--bitumi);color:var(--kalkki);min-height:100vh;font-size:15px;line-height:1.45;padding-bottom:calc(92px + var(--safe-b))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--kulta);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}

/* Yläpalkki */
.top{position:sticky;top:0;z-index:20;background:var(--multa);display:flex;align-items:center;gap:10px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--multa3)}
.top img{height:44px;width:auto;display:block}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--multa2);color:var(--kalkki);font-size:18px;flex:none}
.top .ttl{font-weight:700;font-stretch:80%;font-size:19px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.wrap{max-width:560px;margin:0 auto;padding:16px}

/* Otsikot */
h1{font-stretch:72%;font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.005em;margin:6px 0 4px}
h2{font-stretch:80%;font-weight:750;font-size:21px;line-height:1.1;margin:22px 0 10px}
h3{font-weight:650;font-size:15px;margin:0 0 6px}
.lead{color:var(--savi);font-size:14px;margin-bottom:14px;max-width:46ch}
.muted{color:var(--savi)}
.small{font-size:12.5px}

/* Pinnat */
.panel{background:var(--multa);border-radius:var(--r-m);padding:14px;margin-bottom:10px}
.panel.flat{background:transparent;border:1px solid var(--multa2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack>*+*{margin-top:10px}

/* Lomake */
label.f{display:block}
label.f>span{display:block;font-size:12.5px;color:var(--savi);margin-bottom:4px}
input,textarea,select{width:100%;background:var(--bitumi);border:1px solid var(--multa3);border-radius:var(--r-s);padding:11px 12px;font-size:15px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--kulta)}
textarea{resize:vertical;line-height:1.5}
input.r{text-align:right}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--savi) 50%),linear-gradient(135deg,var(--savi) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

/* Napit */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:var(--r-m);font-weight:700;font-size:16px;background:var(--kulta);color:#1d170d;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--multa2);color:var(--kalkki);font-weight:600}
.btn.line{background:transparent;border:1px solid var(--multa3);color:var(--kalkki);font-weight:600}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:999px}
.btn.danger{background:transparent;border:1px solid #6b3b2a;color:var(--vaara)}
.btns>*+*{margin-top:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--multa);color:var(--savi);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--kalkki);color:var(--bitumi)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* Tila-merkit */
.st{display:inline-block;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--multa2);color:var(--savi);white-space:nowrap}
.st.luonnos{background:#3a3326;color:#cbbf9f}
.st.lahetetty{background:#2d3542;color:#a9c2e4}
.st.hyvaksytty{background:#2f3b25;color:#b6d696}
.st.valmis{background:var(--multa2);color:var(--savi)}
.st.hylatty{background:#3f2a22;color:#e5a58c}

/* Mittanauha: kate vs tavoite */
.tape{position:relative;height:30px;margin:6px 0 4px}
.tape .trk{position:absolute;inset:8px 0 6px;border-radius:3px;background:
  repeating-linear-gradient(90deg,rgba(239,233,221,.22) 0 1px,transparent 1px calc(100%/12)),
  var(--multa2)}
.tape .fill{position:absolute;left:0;top:8px;bottom:6px;border-radius:3px;background:
  repeating-linear-gradient(90deg,rgba(29,23,13,.35) 0 1px,transparent 1px calc(100%/12)) ,var(--kulta);
  background-size:var(--bs,100%) 100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.tape.low .fill{background:repeating-linear-gradient(90deg,rgba(29,23,13,.35) 0 1px,transparent 1px calc(100%/12)),var(--vaara);background-size:var(--bs,100%) 100%}
.tape .tgt{position:absolute;top:2px;bottom:0;width:2px;background:var(--kalkki);border-radius:1px}
.tape .tgt::before{content:"";position:absolute;top:-2px;left:-4px;border:5px solid transparent;border-top-color:var(--kalkki)}
.tape-l{display:flex;justify-content:space-between;font-size:12px;color:var(--savi)}
.tape.mini{height:18px;margin:4px 0 0}
.tape.mini .trk,.tape.mini .fill{top:5px;bottom:3px}
.tape.mini .tgt{top:1px}
.tape.mini .tgt::before{display:none}

/* Iso luku */
.big{font-stretch:68%;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em}
.big small{font-size:22px;font-weight:700;color:var(--savi);margin-left:2px}

/* Työmaarivit */
.job{display:block;width:100%;text-align:left;background:var(--multa);border-radius:var(--r-m);padding:13px 14px 10px;margin-bottom:8px}
.job .t{font-weight:700;font-size:16px;line-height:1.2}
.job .s{font-size:13px;color:var(--savi);margin-top:2px}
.job .sum{font-weight:700;font-stretch:85%;font-size:17px;white-space:nowrap}

/* Tarjousrivit editorissa */
.line{border-top:1px solid var(--multa2);padding:12px 0}
.line:first-child{border-top:none;padding-top:2px}
.line .nm{display:flex;gap:8px;align-items:flex-start}
.line .nm input{font-weight:600}
.line .del{width:40px;height:44px;flex:none;border-radius:var(--r-s);background:var(--multa2);color:var(--savi);font-size:20px}
.line .vals{display:grid;grid-template-columns:.9fr .7fr 1fr 1fr;gap:6px;margin-top:6px}
.line .vals label>span{font-size:11px;color:var(--savi);display:block;margin-bottom:2px}
.line .vals input{padding:9px 8px;font-size:14px}
.line .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--savi);margin-top:6px}
.line .foot b{color:var(--kalkki);font-weight:650}
.flag{font-size:11.5px;font-weight:650;color:#1d170d;background:var(--kulta2);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow button{flex:1;border:1px dashed var(--multa3);border-radius:var(--r-s);padding:11px;color:var(--kulta);font-weight:600;font-size:14px}

/* Yhteenveto */
.sum-tbl{width:100%;font-size:14px;border-collapse:collapse}
.sum-tbl td{padding:4px 0}
.sum-tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sum-tbl tr.tot td{border-top:1px solid var(--multa3);padding-top:9px;font-weight:750;font-size:18px}
.sum-tbl tr.sub td{color:var(--savi)}

/* Lähdevalinta */
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.src button{background:var(--multa);border-radius:var(--r-m);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:var(--kalkki);border:1.5px solid transparent}
.src button svg{width:26px;height:26px;stroke:var(--kulta);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.src button.rec{border-color:var(--vaara);color:var(--vaara)}
.src button.rec svg{stroke:var(--vaara);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs .th{position:relative;width:72px;height:72px;border-radius:var(--r-s);overflow:hidden;background:var(--multa2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(21,17,11,.8);color:var(--kalkki);font-size:14px;line-height:1}

/* Toast, virhe, kuormitus */
.err{background:#3f2a22;color:#f1b9a3;border-radius:var(--r-s);padding:10px 12px;font-size:14px;margin:10px 0}
.note{background:var(--multa);border-left:3px solid var(--kulta);border-radius:0 var(--r-s) var(--r-s) 0;padding:10px 12px;font-size:13.5px;color:var(--kalkki);margin:10px 0}
.note ul{margin:4px 0 0 18px}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--kalkki);color:var(--bitumi);font-weight:650;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(29,23,13,.3);border-top-color:#1d170d;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Alanavigaatio */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(21,17,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--multa2);padding:6px 8px calc(6px + var(--safe-b));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:100%}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--savi);font-size:11.5px;font-weight:600}
nav.bar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bar button.on{color:var(--kalkki)}
nav.bar button.fab{color:var(--kulta)}
nav.bar button.fab span.c{width:52px;height:52px;border-radius:16px;background:var(--kulta);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
nav.bar button.fab span.c svg{stroke:#1d170d;width:28px;height:28px;stroke-width:2.2}

/* Lista (kuitit, tunnit) */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--multa2)}
.li:first-child{border-top:none}
.li .ic{width:44px;height:44px;border-radius:var(--r-s);background:var(--multa2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--savi);font-size:13px;font-weight:700}
.li .ic img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:12.5px;color:var(--savi)}
.li .am{font-weight:700;white-space:nowrap}
.li .x{color:var(--savi);font-size:18px;width:32px;height:32px}

.bar2{height:8px;border-radius:4px;background:var(--multa2);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--kulta);border-radius:4px}
.bar2.over i{background:var(--vaara)}

.tabs{display:flex;background:var(--multa);border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;padding:9px;border-radius:999px;font-weight:650;font-size:14px;color:var(--savi)}
.tabs button.on{background:var(--kalkki);color:var(--bitumi)}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle input{width:auto;accent-color:var(--kulta);transform:scale(1.3)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;border-top:1px solid var(--multa2)}
.check:first-child{border-top:none}
.check input{width:auto;margin-top:3px;accent-color:var(--kulta);transform:scale(1.2)}

.empty{text-align:center;padding:36px 16px;color:var(--savi)}
.empty b{display:block;color:var(--kalkki);font-size:17px;margin-bottom:4px}

.hpl{display:grid;grid-template-columns:1fr 70px 80px 80px 34px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--multa2)}
.hpl input,.hpl select{padding:8px;font-size:13.5px}
.hpl .x{color:var(--savi);font-size:18px}

#print{display:none}

/* ===== TULOSTE (A4) ===== */
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important;padding:0!important;color:#1a1a1a}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
.pdoc{width:210mm;min-height:296mm;background:#fff;color:#1d1a14;font-family:"Archivo",Arial,sans-serif;font-size:10pt;line-height:1.4;display:flex;flex-direction:column}
.pdoc .ph{background:#2B2417;padding:5mm 16mm;display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #C9A560}
.pdoc .ph img{height:22mm;width:auto}
.pdoc .ph .pc{color:#EFE9DD;text-align:right;font-size:9pt;line-height:1.5}
.pdoc .ph .pc b{color:#C9A560;font-size:10.5pt;display:block}
.pdoc .pb{padding:8mm 16mm 6mm;flex:1;display:flex;flex-direction:column}
.pdoc .ptitle{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #C9A560;padding-bottom:3mm;margin-bottom:5mm}
.pdoc .ptitle h1{font-stretch:72%;font-size:28pt;color:#2B2417;margin:0;line-height:1}
.pdoc .ptitle .meta{text-align:right;font-size:9pt;color:#5d5444}
.pdoc .pinfo{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-bottom:5mm;font-size:9.5pt}
.pdoc .pinfo .k{font-size:8pt;color:#8a7f6c;margin-bottom:1mm}
.pdoc .psaate{background:#f7f3ea;border-left:2.5px solid #C9A560;padding:3mm 4mm;margin-bottom:5mm;white-space:pre-wrap}
.pdoc table.pt{width:100%;border-collapse:collapse;margin-bottom:4mm;font-size:9pt}
.pdoc table.pt th{background:#2B2417;color:#E2C584;font-weight:600;text-align:right;padding:2mm 2.5mm;font-size:8.5pt}
.pdoc table.pt th:first-child{text-align:left}
.pdoc table.pt td{padding:1.8mm 2.5mm;border-bottom:.3mm solid #e6dfd0;text-align:right;font-variant-numeric:tabular-nums}
.pdoc table.pt td:first-child{text-align:left}
.pdoc table.pt th:not(:first-child),.pdoc table.pt td:not(:first-child){white-space:nowrap;width:1%}
.pdoc table.pt tr.grp td{background:#f3eee3;font-weight:700;color:#2B2417}
.pdoc table.tt td{vertical-align:top;padding:2.4mm 2.5mm}
.pdoc table.tt td:not(:first-child){white-space:normal;width:auto}
.pdoc table.tt td:last-child{white-space:nowrap}
.pdoc .ptots{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:2mm}
.pdoc .pkv{border:.4mm solid #9bc07a;background:#f1f7ea;border-radius:2mm;padding:3mm 4mm;font-size:9pt}
.pdoc .pkv .h{font-weight:700;color:#3f6b25;margin-bottom:1.5mm}
.pdoc .psum{background:#2B2417;color:#d9d1c1;border-radius:2mm;padding:3mm 4mm;font-size:9pt}
.pdoc .pr{display:flex;justify-content:space-between;padding:.5mm 0}
.pdoc .psum .pr.m{color:#E2C584;font-weight:700;font-size:12pt;border-top:.3mm solid #C9A560;margin-top:1.5mm;padding-top:2mm}
.pdoc .pkv .pr.m{font-weight:700;color:#3f6b25;border-top:.3mm solid #9bc07a;margin-top:1.5mm;padding-top:1.5mm}
.pdoc .pvar{margin-top:5mm;font-size:8.5pt;color:#4a4335}
.pdoc .pvar h4{font-size:9pt;color:#2B2417;margin-bottom:1.5mm}
.pdoc .pvar ul{margin-left:4.5mm}
.pdoc .psign{margin-top:7mm;display:grid;grid-template-columns:1fr 1fr;gap:10mm;font-size:8.5pt;color:#5d5444}
.pdoc .psign div{border-top:.3mm solid #8a7f6c;padding-top:1.5mm}
.pdoc .pf{margin-top:auto;padding-top:5mm;font-size:8pt;color:#8a7f6c;text-align:center;border-top:.3mm solid #e6dfd0}

/* Työtuntilista (vanhan pohjan mukainen) */
.pdoc.tl{font-family:Helvetica,Arial,sans-serif;font-size:9.5pt;color:#1d1a14}
.tl .tl-top{background:#2B2417;padding:3.5mm 16mm;border-bottom:1.2mm solid #C9A560}
.tl .tl-top img{height:20mm;width:auto;display:block}
.tl .tl-body{padding:7mm 16mm 6mm;flex:1;display:flex;flex-direction:column}
.tl .tl-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:.5mm solid #C9A560;padding-bottom:2.5mm}
.tl h1{font-family:Helvetica,Arial,sans-serif;font-size:21pt;font-weight:700;color:#2B2417;letter-spacing:.3pt;margin-top:2mm}
.tl .tl-meta{font-size:8.5pt;border-collapse:collapse}
.tl .tl-meta td{padding:.2mm 0}
.tl .tl-meta td:first-child{color:#8a7f6c;text-align:right;padding-right:6mm}
.tl .tl-meta td:last-child{font-weight:700;text-align:right}
.tl .tl-emp{margin:3mm 0 5mm;font-size:9.5pt}
.tl .tl-t{width:100%;border-collapse:collapse;font-size:9pt}
.tl .tl-t th{background:#2B2417;color:#EFE9DD;font-weight:700;text-align:left;padding:3mm 3mm;font-size:8pt}
.tl .tl-t td{padding:2.6mm 3mm;border-bottom:.3mm solid #e2dccf;vertical-align:top;line-height:1.4}
.tl .tl-t tbody tr:nth-child(odd) td{background:#f6f3ed}
.tl .tl-t td.tl-d{font-weight:700;white-space:nowrap}
.tl .tl-t td.tl-h{font-weight:700;text-align:right;white-space:nowrap}
.tl .tl-t td b{font-weight:700}
.tl .tl-sub+.tl-sub{margin-top:1.5mm}
.tl .tl-mut{color:#8a7f6c;font-weight:400}
.tl .tl-tot{align-self:flex-end;width:68mm;margin-top:7mm;background:#2B2417;border-top:.8mm solid #C9A560;border-radius:1mm;padding:3.5mm 5mm;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:10.5pt}
.tl .tl-tot span:last-child{color:#C9A560}
.tl .tl-pek{align-self:flex-end;font-size:8.5pt;color:#5d5444;margin-top:2mm}
.tl .tl-sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:12mm}
.tl .tl-line{border-bottom:.3mm solid #2B2417;height:8mm;display:flex;align-items:flex-end;gap:5mm;padding-bottom:1mm}
.tl .tl-line i{font-weight:700;font-size:12pt;color:#2B2417}
.tl .tl-line span{font-size:8.5pt;color:#5d5444;padding-bottom:.6mm}
.tl .tl-sign small{display:block;font-size:7.5pt;color:#8a7f6c;margin-top:1.2mm}
.tl .tl-foot{margin-top:auto;border-top:.4mm solid #C9A560;padding-top:2.5mm;text-align:center;font-size:7.5pt;color:#8a7f6c;line-height:1.5}
.tl .tl-foot b{color:#2B2417;font-size:8pt}

let DB = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE)||"null");
    if(d){ d.settings = Object.assign({}, DEFAULTS.settings, d.settings); d.settings.yritys = Object.assign({}, DEFAULTS.settings.yritys, d.settings.yritys); return Object.assign(structuredClone(DEFAULTS), d); }
  }catch(e){}
  const d = structuredClone(DEFAULTS);
  // Vanhan työkalun API-avain mukaan automaattisesti
  try{ const old = localStorage.getItem("tarjous_api_key"); if(old) d.settings.apiKey = old; }catch(e){}
  return d;
}

/* Kuittikuvat IndexedDB:hen (localStorage ei riitä kuville) */
const idb = (()=>{ let p; const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("kr_kuvat",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=(m,f)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("k",m);const q=f(t.objectStore("k"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);}));
  return {put:(k,v)=>tx("readwrite",s=>s.put(v,k)), get:k=>tx("readonly",s=>s.get(k)), del:k=>tx("readwrite",s=>s.delete(k))}; })();

/* ---------- Laskenta ---------- */
function rowCost(r){ return r.tyyppi==="tyo" ? num(r.tunnit)*num(S().palkkakulu) : num(r.maara)*num(r.osto); }
function rowSell(r){ return num(r.maara)*num(r.myynti); }
function calc(j){
  const s=S(), alv=num(s.alv)/100;
  const m={myynti:0,kust:0}, t={myynti:0,kust:0,tunnit:0};
  for(const r of j.rivit){ const o=r.tyyppi==="tyo"?t:m; o.myynti+=rowSell(r); o.kust+=rowCost(r); if(r.tyyppi==="tyo") t.tunnit+=num(r.tunnit); }
  const myynti=m.myynti+t.myynti, kust=m.kust+t.kust, kate=myynti-kust;
  const alvEur=myynti*alv, yht=myynti+alvEur;
  const hlo=j.kvHenkilot||1, tyoAlv=t.myynti*(1+alv);
  const kvBrutto=tyoAlv*num(s.kvPros)/100;
  const kv = j.kvOn===false?0:Math.max(0,Math.min(kvBrutto-num(s.kvOmav)*hlo, num(s.kvMax)*hlo));
  return {m,t,myynti,kust,kate,katePct:myynti?kate/myynti*100:0,alvEur,yht,tyoAlv,kvBrutto,kv,netto:yht-kv,hlo};
}
function actuals(j){
  const rs=DB.receipts.filter(r=>r.jobId===j.id), hs=DB.hours.filter(h=>h.jobId===j.id);
  const mat=rs.reduce((a,r)=>a+num(r.summa),0), tunnit=hs.reduce((a,h)=>a+num(h.tunnit),0);
  const tyo=tunnit*num(S().palkkakulu);
  if(j.suora){
    const st=S(), alv=num(st.alv)/100, th=num(j.tuntihinta)||num(st.tuntihinta);
    const tyoMyynti=tunnit*th, matMyynti=mat*(1+num(st.matkate)/100);
    const myynti=j.laskutus==="urakka"?num(j.urakka):tyoMyynti+matMyynti, kust=mat+tyo, kate=myynti-kust;
    const c={suora:true,myynti,kust,kate,katePct:myynti?kate/myynti*100:0,tyoMyynti,matMyynti,th,alvEur:myynti*alv,yht:myynti*(1+alv),m:{kust:0,myynti:matMyynti},t:{kust:0,tunnit:0,myynti:tyoMyynti}};
    return {rs,hs,mat,tunnit,tyo,kustNyt:kust,ennKust:kust,ennKate:kate,ennPct:c.katePct,c};
  }
  const c=calc(j);
  // Ennuste: kumpi on isompi, budjetti vai jo toteutunut
  const ennKust=Math.max(c.m.kust,mat)+Math.max(c.t.kust,tyo);
  const ennKate=c.myynti-ennKust;
  return {rs,hs,mat,tunnit,tyo,kustNyt:mat+tyo,ennKust,ennKate,ennPct:c.myynti?ennKate/c.myynti*100:0,c};
}

/* Mittanauha: asteikko 0–60 %, tavoite merkkinä */
function tape(val,target,mini){
  const max=60, w=Math.max(0,Math.min(100,val/max*100)), tg=Math.max(0,Math.min(100,target/max*100));
  return `<div class="tape${mini?" mini":""}${val<target?" low":""}"><div class="trk"></div><div class="fill" style="width:${w}%;--bs:${w>0?(100/w*100):100}%"></div><div class="tgt" style="left:calc(${tg}% - 1px)"></div></div>`;
}

/* ---------- Claude-kutsu ---------- */
async function claude(content, maxTokens=4000){
  const s=S();
  if(!s.apiKey){ throw new Error("API-avain puuttuu. Lisää se Asetuksista."); }
  const resp = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":s.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:s.model||"claude-sonnet-5-5",max_tokens:maxTokens,messages:[{role:"user",content}]})
  });
  const data = await resp.json().catch(()=>({}));
  if(!resp.ok || data.error) throw new Error(data.error?.message || ("Palvelin vastasi "+resp.status));
  const text=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text||"").join("");
  const sr=data.stop_reason||"?";
  const a=text.indexOf("{"), b=text.lastIndexOf("}");
  if(a<0||b<0){
    if(sr==="max_tokens") throw new Error("Vastaus katkesi kesken (liian pitkä). Yritä uudelleen tai lyhennä kuvausta.");
    if(sr==="refusal") throw new Error("Malli kieltäytyi vastaamasta. Muotoile pyyntö uudelleen.");
    throw new Error(`Malli ei palauttanut tarjousdataa (syy: ${sr}). Vastaus alkoi: "${text.slice(0,160)||"tyhjä"}"`);
  }
  try{ return JSON.parse(text.slice(a,b+1)); }
  catch(e){ throw new Error(sr==="max_tokens"?"Vastaus katkesi kesken. Yritä uudelleen.":"Tarjousdata oli virheellisessä muodossa. Yritä uudelleen."); }
}

/* Kuvan pienennys ennen lähetystä */
function shrink(file,max=1568,q=.85){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Tämä selain ei tue sanelua — käytä näppäimistön mikrofonia"); return; }
  if(recOn){ stopVoice(); return; }
  rec=new SR(); rec.lang="fi-FI"; rec.continuous=true; rec.interimResults=true;
  const ta=$("#newText"); let base=ta.value?ta.value.replace(/\s*$/,"")+" ":"";
  rec.onresult=e=>{ let fin="",tmp=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t+" "; else tmp+=t; }
    if(fin){ base+=fin; } const el=$("#newText"); if(el){ el.value=base+tmp; NEW.text=el.value; } };
  rec.onend=()=>{ if(recOn){ try{ rec.start(); }catch(e){} } };
  rec.onerror=e=>{ if(e.error==="not-allowed"){ toast("Salli mikrofoni selaimen asetuksista"); stopVoice(); } };
  recOn=true; try{ rec.start(); }catch(e){}
  const b=$("#micBtn"); if(b){ b.classList.add("rec"); $("#micTx").textContent="Lopeta"; }
}

function lineFoot(r){
  const sell=rowSell(r), cost=rowCost(r), k=sell?(sell-cost)/sell*100:0;
  return `<span>${r.arvio?'<span class="flag" style="margin:0 6px 0 0">arvio, tarkista</span>':""}kate ${pct(k)}</span><b class="num">${eur(sell)}</b>`;
}
function setJ(id,k,v){ const j=job(id); j[k]=v; touch(j); if(k==="otsikko") setTop(`${j.nro}  ${jobName(j)}`,true); }
function setA(id,k,v){ const j=job(id); j.asiakas[k]=v; touch(j); }
function setR(id,rid,k,v){
  const j=job(id), r=j.rivit.find(x=>x.id===rid);
  r[k] = ["maara","osto","myynti","tunnit"].includes(k)?num(v):v;
  if(["osto","myynti"].includes(k)) r.arvio=false;
  touch(j); $("#lf-"+rid).innerHTML=lineFoot(r); refreshKate(id);
}
function refreshKate(id){ const j=job(id), b=$("#kateBox"); if(b) b.innerHTML=kateBoxHTML(j,calc(j),num(S().katetavoite)); }
function addRow(id,t){ const j=job(id); j.rivit.push(t==="tyo"?{id:uid(),tyyppi:"tyo",nimi:"",maara:1,yks:"h",myynti:num(S().tuntihinta),tunnit:1}:{id:uid(),tyyppi:"mat",nimi:"",maara:1,yks:"kpl",osto:0,myynti:0}); touch(j); render(); }
function delRow(id,rid){ const j=job(id); j.rivit=j.rivit.filter(r=>r.id!==rid); touch(j); render(); }
function hitTarget(id){
  const j=job(id), c=calc(j), tg=num(S().katetavoite)/100;
  if(!c.myynti) return;
  const k=(c.kust/(1-tg))/c.myynti;
  j.rivit.forEach(r=>r.myynti=Math.ceil(num(r.myynti)*k*100)/100);
  touch(j); render(); toast(`Myyntihinnat +${Math.round((k-1)*100)} %`);
}
function pickHinnasto(id,t){
  const items=DB.hinnasto.filter(h=>h.tyyppi===t);

function addFromH(id,hid){
  const j=job(id), h=DB.hinnasto.find(x=>x.id===hid), s=S();
  j.rivit.push(h.tyyppi==="tyo"
    ?{id:uid(),tyyppi:"tyo",nimi:h.nimi,maara:1,yks:h.yks,myynti:num(h.myynti),tunnit:num(h.h)}
    :{id:uid(),tyyppi:"mat",nimi:h.nimi,maara:1,yks:h.yks,osto:num(h.osto),myynti:h.myynti?num(h.myynti):Math.round(num(h.osto)*(1+num(s.matkate)/100)*100)/100});

function toggleVar(id,i,on){ const j=job(id), v=fillVar(DB.varaumat[i]); j.varaumat=j.varaumat.filter(x=>x!==v); if(on) j.varaumat.push(v); touch(j); }

function delJob(id){
  if(!confirm("Poistetaanko työ, sen kuitit ja tunnit pysyvästi?")) return;
  DB.receipts.filter(r=>r.jobId===id).forEach(r=>idb.del(r.id).catch(()=>{}));
  DB.jobs=DB.jobs.filter(j=>j.id!==id); DB.receipts=DB.receipts.filter(r=>r.jobId!==id); DB.hours=DB.hours.filter(h=>h.jobId!==id);

/* ISO-viikot */
function mondayOf(d){ const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoWeek(d){ const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()+3-((x.getDay()+6)%7)); const w1=new Date(x.getFullYear(),0,4,12); return {w:1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7),y:x.getFullYear()}; }
const isoOf = d=>{ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };

function hourRow(h){ return `<div class="li"><div class="ic">${esc((h.tekija||"?").slice(0,2))}</div><div class="tx"><b>${esc(hourPlace(h))}</b><span>${esc(h.tekija)}, ${fiDate(h.pvm)}${h.kuvaus?", "+esc(h.kuvaus):""}</span></div><div class="am num">${nf(h.tunnit,2)} h</div><button class="x" onclick="delHours('${h.id}')" aria-label="Poista tunnit">×</button></div>`; }

function stepP(d){ const e=$("#hPek"); e.value=nf(Math.max(0,num(e.value)+d)); pekSum(); }

  if(h&&h.jobId) touch(job(h.jobId)); else save();

  const pt=p?`, pekkasta ${nf(p)} h`:"";
  toast(h&&h.jobId?`${nf(t)} h kirjattu${pt}, kate ${pct(actuals(job(h.jobId)).ennPct)}`:t?`${nf(t)} h kirjattu${pt}`:`Pekkasta ${nf(p)} h kirjattu`); render();
}

/* ---------- Viikon tuntilista ---------- */
function weekData(){
  if(!WK){ let t=DB.tekijat[0]||""; try{ t=JSON.parse(localStorage.getItem("kr_last_hours")||"{}").tekija||t; }catch(e){} WK={tekija:t,mon:isoOf(mondayOf(new Date()))}; }
  const mon=new Date(WK.mon+"T12:00:00"), days=[];
  for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(d.getDate()+i); const iso=isoOf(d);
    days.push({i,iso,rows:DB.hours.filter(h=>h.pvm===iso&&h.tekija===WK.tekija).sort((a,b)=>(a.luotu||0)-(b.luotu||0))}); }
  const tot=days.reduce((a,d)=>a+d.rows.reduce((x,h)=>x+num(h.tunnit),0),0);
  const pek=days.reduce((a,d)=>a+d.rows.filter(h=>h.tyyppi==="pekkanen").reduce((x,h)=>x+num(h.tunnit),0),0);
  const {w,y}=isoWeek(mon), sun=new Date(mon); sun.setDate(sun.getDate()+6);
  return {days,tot,pek,w,y,mon,sun,range:`${mon.getDate()}.${mon.getMonth()+1}.–${sun.getDate()}.${sun.getMonth()+1}.${sun.getFullYear()}`};
}
function shiftWeek(n){ const d=new Date(WK.mon+"T12:00:00"); d.setDate(d.getDate()+7*n); WK.mon=isoOf(d); vWeek(); }
function vWeek(){
  const W=weekData();
  $("#hBody").innerHTML=`
    <div class="row between" style="margin-bottom:10px">
      <button class="btn sm ghost" onclick="shiftWeek(-1)" aria-label="Edellinen viikko">‹</button>
      <div style="text-align:center"><div style="font-stretch:75%;font-weight:800;font-size:24px">Viikko ${W.w}</div><div class="small muted">${W.range}</div></div>
      <button class="btn sm ghost" onclick="shiftWeek(1)" aria-label="Seuraava viikko">›</button>
    </div>
    <label class="f" style="margin-bottom:10px"><span>Tekijä</span><select onchange="WK.tekija=this.value;vWeek()">${DB.tekijat.map(t=>`<option ${t===WK.tekija?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
    <div class="panel">
      ${W.days.filter(d=>d.i<5||d.rows.length).map((d,n)=>`
        <div style="padding:8px 0;${n?"border-top:1px solid var(--multa2)":"padding-top:0"}">
          <div class="row between"><b>${PV[d.i]} <span class="muted" style="font-weight:500">${fiDate(d.iso)}</span></b><b class="num">${d.rows.length?nf(d.rows.reduce((x,h)=>x+num(h.tunnit),0),2)+" h":'<span class="muted">–</span>'}</b></div>
          ${d.rows.map(h=>`<div class="row between small" style="margin-top:3px"><span class="muted">${esc(hourPlace(h))}${h.kuvaus?", "+esc(h.kuvaus):""}</span><span class="row" style="gap:4px"><span class="num">${nf(h.tunnit,2)} h</span><button class="x muted" style="width:26px;height:26px" onclick="delHours('${h.id}')" aria-label="Poista">×</button></span></div>`).join("")}
        </div>`).join("")}
      <div class="row between" style="border-top:1px solid var(--multa3);padding-top:10px;margin-top:4px;font-weight:750;font-size:18px"><span>Yhteensä</span><span class="num">${nf(W.tot,2)} h</span></div>
      ${W.pek?`<div class="row between small muted" style="margin-top:4px"><span>josta pekkasta</span><span class="num">${nf(W.pek,2)} h</span></div><div class="row between small muted"><span>työmailla</span><span class="num">${nf(W.tot-W.pek,2)} h</span></div>`:""}
    </div>
    <div class="btns" style="margin-top:14px">
      <button class="btn" onclick="printWeek()" ${W.tot?"":"disabled"}>Tallenna PDF</button>
      <button class="btn ghost" onclick="mailWeek()" ${W.tot?"":"disabled"}>Lähetä sähköpostilla</button>
      <p class="small muted" style="text-align:center">Tallenna PDF ensin, sitten avaa sähköposti ja liitä PDF viestiin. Tunnit tulevat myös viestin tekstiin.</p>
    </div>`;
}
function weekPdfHTML(){
  const W=weekData(), y=S().yritys, ab=["Ma","Ti","Ke","To","Pe","La","Su"];
  const days=W.days.filter(d=>d.i<5||d.rows.length);
  const sum=rs=>rs.reduce((x,h)=>x+num(h.tunnit),0);
  const rows=days.map(d=>{
    const work = !d.rows.length ? `<span class="tl-mut">–</span>`
      : d.rows.length===1 ? `<b>${esc(hourPlace(d.rows[0]))}</b>${d.rows[0].kuvaus?`<div>${esc(d.rows[0].kuvaus)}</div>`:""}`
      : d.rows.map(h=>`<div class="tl-sub"><b>${esc(hourPlace(h))}</b> <span class="tl-mut">(${nf(h.tunnit,2)} h)</span>${h.kuvaus?`<div>${esc(h.kuvaus)}</div>`:""}</div>`).join("");
    return `<tr><td class="tl-d">${ab[d.i]} ${fiDate(d.iso)}</td><td>${work}</td><td class="tl-h">${d.rows.length?nf(sum(d.rows),2)+" h":"–"}</td></tr>`;
  }).join("");
  const nimi = WK.tekija==="Teemu"?"Teemu Ravattinen":WK.tekija;
  return `<div class="pdoc tl">
    <div class="tl-top"><img src="${LOGO}" alt=""/></div>
    <div class="tl-body">
      <div class="tl-head">
        <h1>TYÖTUNTILISTA</h1>
        <table class="tl-meta"><tr><td>Päiväys</td><td>${fiDate(todayISO())}</td></tr><tr><td>Viikko</td><td>${W.w} / ${W.y}</td></tr><tr><td>Ajanjakso</td><td>${W.range}</td></tr></table>
      </div>
      <div class="tl-emp"><b>Työntekijä:</b> ${esc(WK.tekija)}</div>
      <table class="tl-t"><thead><tr><th style="width:24mm">Päivä</th><th>Työkohde ja tehtävät</th><th style="width:18mm;text-align:right">Tunnit</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="tl-tot"><span>YHTEENSÄ</span><span>${nf(W.tot,2)} h</span></div>
      ${W.pek?`<div class="tl-pek">josta pekkasta ${nf(W.pek,2)} h, työmailla ${nf(W.tot-W.pek,2)} h</div>`:""}
      <div class="tl-sign">
        <div><div class="tl-line"><i>${esc(nimi)}</i><span>${fiDate(todayISO())}</span></div><small>Työntekijän allekirjoitus ja pvm</small></div>
        <div><div class="tl-line"></div><small>Hyväksyjän allekirjoitus ja pvm</small></div>
      </div>
      <div class="tl-foot"><b>${esc(y.nimi)}</b><br>${esc(y.osoite)}  |  ${esc(y.www)}</div>
    </div></div>`;
}
function printWeek(){
  const W=weekData(); $("#print").innerHTML=weekPdfHTML();
  const t=document.title; document.title=`Tyotuntilista vko ${W.w} ${WK.tekija}`;
  setTimeout(()=>{ window.print(); document.title=t; },150);
}
function mailWeek(){
  const W=weekData();
  const lines=W.days.flatMap(d=>d.rows.map(h=>`${PV[d.i].slice(0,2)} ${fiDate(d.iso)}  ${hourPlace(h)}${h.kuvaus?" ("+h.kuvaus+")":""}  ${nf(h.tunnit,2)} h`));
  const subj=WK.tekija==="Teemu"?"Teemun työtunnit":`Työtunnit ${WK.tekija}`;
  const body=`Tässä tämän viikon tunnit (vko ${W.w}, ${W.range}).\n\n${lines.join("\n")}\n\nYhteensä ${nf(W.tot,2)} h${W.pek?`, josta pekkasta ${nf(W.pek,2)} h`:""}\n\nTerveisin, ${WK.tekija}`;
  location.href=`mailto:${encodeURIComponent(S().tuntiEmail||"")}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

/* =====================================================================
   ASETUKSET
   ===================================================================== */
function vSettings(){
  setTop("Asetukset",true);
  const s=S(), y=s.yritys;
  const inp=(path,label,val,attrs="")=>`<label class="f"><span>${label}</span><input value="${esc(val)}" ${attrs} onchange="setS('${path}',this.value)"/></label>`;
  $("#view").innerHTML=`
    <h2 style="margin-top:4px">Hinnoittelu</h2>
    <div class="panel stack">
      <div class="grid2">${inp("tuntihinta","Työn myyntihinta €/h alv 0",nf(s.tuntihinta),'inputmode="decimal" class="r"')}${inp("palkkakulu","Oma työkustannus €/h",nf(s.palkkakulu),'inputmode="decimal" class="r"')}</div>
      <div class="grid2">${inp("katetavoite","Katetavoite %",nf(s.katetavoite),'inputmode="decimal" class="r"')}${inp("matkate","Materiaalien lisä %",nf(s.matkate),'inputmode="decimal" class="r"')}</div>
      <p class="small muted">Oma työkustannus sisältää palkan sivukuluineen. Sillä lasketaan kate, se ei näy asiakkaalle.</p>
    </div>

    <h2>Hinnasto</h2>
    <p class="small muted" style="margin-bottom:8px">Materiaaleille ostohinta. Myyntihinta tyhjänä = ostohinta + materiaalien lisä. Työriveille urakkahinta ja työaika per yksikkö.</p>
    <div class="panel" id="hinnasto">${hinnastoHTML()}</div>

    <h2>Vakiovaraumat</h2>
    <p class="small muted" style="margin-bottom:8px">Yksi varauma per rivi. {tuntihinta} korvautuu tuntihinnalla.</p>
    <textarea rows="7" onchange="DB.varaumat=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);save();toast('Tallennettu')">${esc(DB.varaumat.join("\n"))}</textarea>

    <h2>Tekijät</h2>
    <input value="${esc(DB.tekijat.join(", "))}" onchange="DB.tekijat=this.value.split(',').map(x=>x.trim()).filter(Boolean);save();toast('Tallennettu')" placeholder="Teemu, Heikki"/>
    <label class="f" style="margin-top:10px"><span>Tuntilistan vastaanottaja (sähköposti)</span><input type="email" value="${esc(s.tuntiEmail||"")}" onchange="setS('tuntiEmail',this.value.trim())"/></label>

    <h2>Yritys tarjouksessa</h2>
    <div class="panel stack">
      ${inp("yritys.nimi","Nimi",y.nimi)}
      <div class="grid2">${inp("yritys.yhteys","Yhteyshenkilö",y.yhteys)}${inp("yritys.puh","Puhelin",y.puh,'type="tel"')}</div>
      ${inp("yritys.email","Sähköposti",y.email,'type="email"')}
      ${inp("yritys.osoite","Osoite",y.osoite)}
      <div class="grid2">${inp("yritys.ytunnus","Y-tunnus",y.ytunnus)}${inp("yritys.www","Verkkosivu",y.www)}</div>
      <div class="grid2">${inp("voimassa","Tarjous voimassa, pv",nf(s.voimassa),'inputmode="numeric" class="r"')}${inp("maksuehto","Maksuehto",s.maksuehto)}</div>
    </div>

    <h2>Verot</h2>
    <div class="panel stack">
      <div class="grid2">${inp("alv","Alv %",nf(s.alv),'inputmode="decimal" class="r"')}${inp("kvPros","Kotitalousvähennys %",nf(s.kvPros),'inputmode="decimal" class="r"')}</div>
      <div class="grid2">${inp("kvOmav","Omavastuu € / hlö",nf(s.kvOmav),'inputmode="decimal" class="r"')}${inp("kvMax","Enimmäismäärä € / hlö",nf(s.kvMax),'inputmode="decimal" class="r"')}</div>
      <p class="small muted">Vuosien 2026–2027 kotitalousvähennys: yritykseltä ostettu työ 40 %, omavastuu 150 €, enintään 2 100 € henkilöä kohden.</p>
    </div>

    <h2>Tekoäly</h2>
    <div class="panel stack">
      <label class="f"><span>Anthropic API-avain</span><input type="password" value="${esc(s.apiKey)}" placeholder="sk-ant-…" onchange="setS('apiKey',this.value.trim())" autocomplete="off"/></label>
      ${inp("model","Malli",s.model)}
      <p class="small muted">Avain tallentuu vain tähän selaimeen ja lähtee ainoastaan Anthropicille.</p>
    </div>

    <h2>Varmuuskopio</h2>
    <p class="small muted" style="margin-bottom:8px">Kaikki tiedot ovat tämän puhelimen selaimessa. Ota varmuuskopio säännöllisesti. Kuittikuvat eivät sisälly kopioon.</p>
    <div class="grid2"><button class="btn ghost" onclick="exportData()">Lataa varmuuskopio</button><button class="btn ghost" onclick="$('#fileImport').click()">Palauta kopiosta</button></div>
  `;
}
function hinnastoHTML(){
  const sec=t=>DB.hinnasto.filter(h=>h.tyyppi===t).map(h=>`
    <div class="hpl"><input value="${esc(h.nimi)}" onchange="setH('${h.id}','nimi',this.value)" aria-label="Nimi"/>
      <input value="${esc(h.yks)}" onchange="setH('${h.id}','yks',this.value)" aria-label="Yksikkö"/>
      ${t==="mat"
        ?`<input class="r" inputmode="decimal" value="${nf(h.osto)}" onchange="setH('${h.id}','osto',this.value)" aria-label="Ostohinta"/><input class="r" inputmode="decimal" value="${nf(h.myynti)}" placeholder="auto" onchange="setH('${h.id}','myynti',this.value)" aria-label="Myyntihinta"/>`
        :`<input class="r" inputmode="decimal" value="${nf(h.myynti)}" onchange="setH('${h.id}','myynti',this.value)" aria-label="Myyntihinta"/><input class="r" inputmode="decimal" value="${nf(h.h)}" onchange="setH('${h.id}','h',this.value)" aria-label="Tunnit per yksikkö"/>`}
      <button class="x" onclick="DB.hinnasto=DB.hinnasto.filter(x=>x.id!=='${h.id}');save();$('#hinnasto').innerHTML=hinnastoHTML()" aria-label="Poista">×</button></div>`).join("");
  return `<h3>Materiaalit</h3><div class="hpl small muted" style="border:none"><span>Tuote</span><span>Yks.</span><span>Osto €</span><span>Myynti €</span><span></span></div>${sec("mat")}
    <div class="addrow"><button onclick="addH('mat')">+ Materiaali</button></div>
    <h3 style="margin-top:16px">Työt ja urakkahinnat</h3><div class="hpl small muted" style="border:none"><span>Työ</span><span>Yks.</span><span>€/yks</span><span>h/yks</span><span></span></div>${sec("tyo")||'<p class="small muted">Esim. Vedeneristys, m², 28 €, 0,4 h</p>'}
    <div class="addrow"><button onclick="addH('tyo')">+ Työ</button></div>`;
}
function addH(t){ DB.hinnasto.push({id:uid(),tyyppi:t,nimi:"",yks:t==="tyo"?"m²":"kpl",osto:t==="mat"?0:null,myynti:t==="tyo"?0:null,h:t==="tyo"?0:null}); save(); $("#hinnasto").innerHTML=hinnastoHTML(); }
function setH(id,k,v){ const h=DB.hinnasto.find(x=>x.id===id); h[k]=["osto","myynti","h"].includes(k)?(String(v).trim()===""?null:num(v)):v; save(); }
function setS(path,v){
  const numeric=["tuntihinta","palkkakulu","katetavoite","matkate","alv","kvPros","kvOmav","kvMax","voimassa"];
  const p=path.split("."); let o=DB.settings; while(p.length>1) o=o[p.shift()];
  o[p[0]]=numeric.includes(p[0])?num(v):v; save(); toast("Tallennettu");
}
function exportData(){
  const data=JSON.stringify(Object.assign({},DB,{settings:Object.assign({},DB.settings,{apiKey:""})}),null,1);
  const a=document.createElement("a");
  a.href="data:application/json;charset=utf-8,"+encodeURIComponent(data);
  a.download=`tarjous-varmuuskopio-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
}
$("#fileImport").onchange=e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.jobs) throw 0;
    if(!confirm(`Palautetaanko ${d.jobs.length} työmaata? Nykyiset tiedot korvataan.`)) return;
    const key=DB.settings.apiKey; DB=Object.assign(structuredClone(DEFAULTS),d); DB.settings=Object.assign({},DEFAULTS.settings,d.settings,{apiKey:d.settings?.apiKey||key}); save(); go("jobs",{},true); toast("Palautettu");
  }catch(err){ toast("Tiedosto ei ole tämän sovelluksen varmuuskopio"); } }; fr.readAsText(f);
};

/* ---------- Käynnistys ---------- */
(function init(){
  const h=location.hash.slice(1).split("/");
  const name=["jobs","new","suora","receipt","hours","settings","job","preview"].includes(h[0])?h[0]:"jobs";
  R={name,p:h[1]?{id:h[1]}:{}};
  if((name==="job"||name==="preview")&&!job(h[1])) R={name:"jobs",p:{}};
  hist(R,location.hash||"#jobs",true);
  render();
})();
</script>
</body>
</html>
